<div class="max-w-2xl mx-auto p-6 bg-white border border-gray-200 rounded-lg shadow-sm mt-8">
  <div class="border-b border-gray-200 pb-4 mb-5">
    <h2 class="text-2xl font-bold text-red-600 flex items-center gap-2">
      <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      Confirmar Eliminación
    </h2>
    <p class="text-sm text-gray-500 mt-1">¿Estás seguro de que deseas eliminar este registro de forma permanente?</p>
  </div>

  <div class="space-y-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200 text-sm">
    <div class="grid grid-cols-3 gap-2">
      <span class="font-semibold text-gray-700">Matrícula:</span>
      <span class="col-span-2 text-gray-900 font-mono">{{ alumno.matricula }}</span>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <span class="font-semibold text-gray-700">Nombre completo:</span>
      <span class="col-span-2 text-gray-900">{{ alumno.nombre }} {{ alumno.apaterno }} {{ alumno.amaterno }}</span>
    </div>
    <div class="grid grid-cols-3 gap-2">
      <span class="font-semibold text-gray-700">Correo institucional:</span>
      <span class="col-span-2 text-gray-900">{{ alumno.correo }}</span>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3">
    <button
      type="button"
      (click)="cancelar()"
      class="text-gray-700 bg-white hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 border border-gray-300 transition-colors">
      Cancelar
    </button>
    <button
      type="button"
      (click)="confirmarEliminar()"
      class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
      Eliminar definitivamente
    </button>
  </div>
</div>
